name: ghcr-visibility-test
on:
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Push a test image with GITHUB_TOKEN
        run: |
          brew install oras >/dev/null 2>&1 || true
          oras login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          echo "test-content" > /tmp/tiny.txt
          oras push "ghcr.io/tmonk/tectdist/vis-test:1" /tmp/tiny.txt
          echo "push ok"
      - name: Try to make it public (various endpoints)
        run: |
          for raw in "tectdist/vis-test" "tectdist%2Fvis-test"; do
            echo "-- candidate: $raw --"
            gh api -X POST "user/packages/container/$raw/visibility" -f visibility=public 2>&1 | head -c 120; echo
            gh api -X POST "users/tmonk/packages/container/$raw/visibility" -f visibility=public 2>&1 | head -c 120; echo
          done
      - name: Anonymous check
        run: |
          sleep 5
          echo "anon tags/list:"
          curl -s -o /dev/null -w '%{http_code}\n' "https://ghcr.io/v2/tmonk/tectdist/vis-test/tags/list"
          curl -s -o /dev/null -w 'anon manifest: %{http_code}\n' "https://ghcr.io/v2/tmonk/tectdist/vis-test/manifests/1" -H "Accept: application/vnd.oci.image.manifest.v1+json"

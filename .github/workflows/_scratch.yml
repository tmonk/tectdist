name: scratch
on:
  workflow_dispatch: {}
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Emit bottle block
        run: |
          ls -la
          for j in *.bottle.json; do
            python3 - "$j" <<'PYEOF'
import json, sys
d = json.load(open(sys.argv[1]))
for formula_key, info in d.items():
    b = info["bottle"]
    print("root_url:", b["root_url"], "| rebuild:", b["rebuild"])
    for tag, t in sorted(b["tags"].items()):
        print(f'        {tag}: "{t["sha256"]}"')
PYEOF
          done

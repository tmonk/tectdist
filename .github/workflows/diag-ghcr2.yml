name: diag-ghcr2
on:
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: oras fetch check
        run: |
          brew install oras >/dev/null 2>&1 || true
          oras login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          for tag in 0.2.0.arm64_linux 0.2.0.arm64_sequoia; do
            echo "-- $tag --"
            oras manifest fetch "ghcr.io/tmonk/tectdist/tectdist:$tag" 2>&1 | head -c 200
            echo
          done

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      - name: Test
        run: |
          python make_links.py
          python -m py_compile src/tectdist/*.py build.py make_links.py install.py uninstall.py tests/*.py
          python tests/check_install.py
          python tests/check_formula.py
          python build.py
          ./dist/tectdist --version
          python tests/check_purity.py --no-build
          python tests/battery.py --mock-only

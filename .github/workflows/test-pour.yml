name: test-pour
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  pour:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@c8707045ccae42888fe98e86f2ee8938bc7cc193 # 2026.08.03.2

      - name: Fresh install from the tap and verify the published bottle
        run: |
          set -euo pipefail
          brew tap tmonk/brew
          brew install tmonk/brew/tectdist 2>&1 | tee /tmp/tectdist-install.log
          grep -q "Pouring tectdist" /tmp/tectdist-install.log
          tectdist doctor
          biber --version | grep -q "biber version: 2.17"
          test "$(find "$(brew --prefix tectdist)/bin" -maxdepth 1 -type l -o -type f | wc -l | tr -d ' ')" -ge 62

name: test-pour
on:
  workflow_dispatch: {}
  schedule:
    # Catch a Homebrew dependency change that invalidates a published bottle.
    - cron: "17 5 * * 1"
permissions:
  contents: read
jobs:
  pour:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@c8707045ccae42888fe98e86f2ee8938bc7cc193 # 2026.08.03.2

      - name: Fresh install from the tap and exercise every documented path
        run: |
          brew tap tmonk/brew
          # A bottle must pour when the published formula declares one. During
          # an ABI remediation it is intentionally absent, so exercise the
          # source-install fallback instead of failing before the real test.
          if brew cat tmonk/brew/tectdist | grep -q '^  bottle do$'; then
            TECTDIST_REQUIRE_BOTTLE=1 tests/homebrew_e2e.sh
          else
            tests/homebrew_e2e.sh
          fi

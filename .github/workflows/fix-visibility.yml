name: fix-ghcr-visibility

# One-off helper: set the ghcr.io/tmonk/tectdist container package to
# public so anonymous `brew install` can fetch bottles.  Idempotent; the
# normal bottles workflow also makes the package public after each push
# (build-bottles.yml "Make package public" step).

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  make-public:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Make package public
        run: |
          for raw in "tectdist/tectdist" "tectdist"; do
            ENC=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$raw")
            if gh api -X POST "user/packages/container/${ENC}/visibility" -f visibility=public >/dev/null 2>&1; then
              echo "made public: $raw"
              exit 0
            fi
          done
          echo "no candidate package found (check the pushed image path)" >&2
          exit 1

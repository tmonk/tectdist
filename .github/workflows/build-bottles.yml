name: bottles

# Build and publish prebuilt bottles for the tap.
# Run after a release (workflow_dispatch) or automatically on any v* tag push.
# Each platform builds from source, bottles, and uploads the archive to the
# release under brew's fetch name {name}-{version}.{tag}.bottle.tar.gz.
# See RELEASING.md §4c.

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: bottles
  cancel-in-progress: false

jobs:
  bottle:
    name: bottle-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arm64_sequoia
            runner: macos-15
          - platform: x86_64_sequoia
            runner: macos-15-intel
          - platform: x86_64_linux
            runner: ubuntu-24.04
          - platform: arm64_linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@c8707045ccae42888fe98e86f2ee8938bc7cc193 # 2026.08.03.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tap
        run: |
          brew tap tmonk/brew

      - name: Build from source with --build-bottle
        run: |
          brew install --build-bottle tmonk/brew/tectdist

      - name: Bottle
        run: |
          # version from the tapped formula (the checked-out formula at a tag
          # push predates the sha-fill commit and would report the old release)
          VERSION=$(brew info --json=v2 tmonk/brew/tectdist | python3 -c 'import json,sys; print(json.load(sys.stdin)["formulae"][0]["versions"]["stable"])')
          brew bottle --json --no-rebuild --root-url "https://github.com/tmonk/tectdist/releases/download/v${VERSION}" \
            tmonk/brew/tectdist

      - name: Upload bottle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(brew info --json=v2 tmonk/brew/tectdist | python3 -c 'import json,sys; print(json.load(sys.stdin)["formulae"][0]["versions"]["stable"])')
          ARCHIVE=$(ls *.bottle*.tar.gz)
          # attach under brew's fetch name ({name}-{version}.{tag}.bottle.tar.gz)
          FETCH_NAME=$(basename "${ARCHIVE/--/-}")
          cp "$ARCHIVE" "$FETCH_NAME"
          RELEASE="v${VERSION}"
          if gh release view "$RELEASE" >/dev/null 2>&1; then
            gh release upload "$RELEASE" "$FETCH_NAME" --clobber
            echo "uploaded ${FETCH_NAME} to release ${RELEASE}"
          else
            echo "release ${RELEASE} not found; attach the archive manually" >&2
            exit 1
          fi

      - name: Emit bottle block
        run: |
          python3 scripts/emit_bottle_block.py

      - name: Upload bottle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bottle-${{ matrix.platform }}
          path: |
            *.bottle*.tar.gz
            *.bottle.json
          retention-days: 30

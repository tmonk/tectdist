name: bottles

# Build and publish prebuilt bottles for the tap.
# Run manually (workflow_dispatch) after a release, or automatically on any
# v* tag push.  Each platform builds the formula from source (--build-bottle),
# bottles it, and uploads the resulting archive to the versioned GitHub
# release as an asset:
#   https://github.com/tmonk/tectdist/releases/download/v0.2.0/tectdist--0.2.0.<platform>.bottle.1.tar.gz
# The bottle store is the release itself (public by default, no registry
# tokens needed): brew's flat-file bottle fetch is {root_url}/{filename}, and
# the formula's `bottle do` block declares
#   root_url "https://github.com/tmonk/tectdist/releases/download/v0.2.0"
# so brew install pours the archive.  ghcr.io/tmonk/tectdist was evaluated
# and ruled out: GITHUB_TOKEN cannot make a user-namespace ghcr package
# public (only the account owner's write:packages PAT can), while release
# assets are public by default.  See RELEASING.md "Bottles".
#
# The per-platform sha256s land in the workflow's "Bottle block" step output;
# a maintainer pastes them into Formula/tectdist.rb.

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: bottles
  cancel-in-progress: false

jobs:
  bottle:
    name: bottle-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arm64_sequoia
            runner: macos-15
          - platform: x86_64_sequoia
            runner: macos-15-intel
          - platform: x86_64_linux
            runner: ubuntu-24.04
          - platform: arm64_linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tap
        run: |
          brew tap tmonk/brew

      - name: Build from source with --build-bottle
        run: |
          brew install --build-bottle tmonk/brew/tectdist

      - name: Bottle
        run: |
          # version is derived from the formula's release-asset URL
          VERSION=$(grep -oE 'tectdist-[0-9]+\.[0-9]+\.[0-9]+' Formula/tectdist.rb | head -1 | sed 's/tectdist-//')
          brew bottle --json --root-url "https://github.com/tmonk/tectdist/releases/download/v${VERSION}" \
            tmonk/brew/tectdist

      - name: Upload bottle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -oE 'tectdist-[0-9]+\.[0-9]+\.[0-9]+' Formula/tectdist.rb | head -1 | sed 's/tectdist-//')
          ARCHIVE=$(ls *.bottle.*.tar.gz)
          RELEASE="v${VERSION}"
          if gh release view "$RELEASE" >/dev/null 2>&1; then
            gh release upload "$RELEASE" "$ARCHIVE" --clobber
            echo "uploaded ${ARCHIVE} to release ${RELEASE}"
          else
            echo "release ${RELEASE} not found; attach the archive manually" >&2
            exit 1
          fi

      - name: Emit bottle block
        run: |
          python3 scripts/emit_bottle_block.py

      - name: Upload bottle artifact
        uses: actions/upload-artifact@v4
        with:
          name: bottle-${{ matrix.platform }}
          path: |
            *.bottle.*.tar.gz
            *.bottle.json
          retention-days: 30

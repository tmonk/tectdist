name: diag-ghcr
on:
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Diagnose
        run: |
          echo "=== whoami ==="
          gh api /user --jq '{login: .login, id: .id}' 2>&1 | head -3
          echo "=== list packages (read attempt) ==="
          gh api '/user/packages?package_type=container' 2>&1 | head -5
          echo "=== try GETs with encoded names ==="
          for raw in "tectdist%2Ftectdist" "tectdist"; do
            echo "-- $raw --"
            gh api "GET /user/packages/container/$raw" 2>&1 | head -3
          done
          echo "=== anonymous tags/list ==="
          curl -s "https://ghcr.io/v2/tmonk/tectdist/tectdist/tags/list" | head -c 200
          echo

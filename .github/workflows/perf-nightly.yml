name: performance nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: [self-hosted, tectdist-perf]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python make_links.py
      - name: Run paired qualification subset
        env:
          TECTDIST_BENCH_DIRECT_TECTONIC: tectonic
        run: >-
          python -m benchmarks.runner.cli --candidate ./bin/pdflatex --trials 30
          --output benchmark-results/nightly.json
      - run: python -m benchmarks.runner.report benchmark-results/nightly.json --output benchmark-results/summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-performance-results
          path: benchmark-results/

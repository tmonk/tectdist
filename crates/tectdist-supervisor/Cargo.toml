[package]
name = "tectdist-supervisor"
version = "0.2.2"
edition = "2021"
license = "AGPL-3.0-only"

[[bin]]
name = "tectdist-supervisor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tectdist-core = { path = "../tectdist-core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[package]
name = "tectdist-engine"
version = "0.2.2"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
tectdist-core = { path = "../tectdist-core" }
tectonic = { git = "https://github.com/tectonic-typesetting/tectonic.git", tag = "tectonic@0.17.0", default-features = false, features = ["geturl-reqwest"], optional = true }
tectonic_bridge_core = { git = "https://github.com/tectonic-typesetting/tectonic.git", tag = "tectonic@0.17.0", optional = true }

[features]
embedded = ["dep:tectonic", "dep:tectonic_bridge_core"]
